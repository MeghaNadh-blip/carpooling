{% extends 'base.html' %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card clean-auth-card">
    <div class="auth-logo"><span>🚙</span><b>Car Pool Manager</b></div>
    <h1>Forgot password</h1>
    <p class="muted">Enter your account email. We’ll send you a secure reset link.</p>
    <form method="post" class="form-stack auth-form-clean">
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <button class="btn primary wide">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</section>
{% endblock %}
