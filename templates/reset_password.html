{% extends 'base.html' %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card clean-auth-card">
    <div class="auth-logo"><span>🚙</span><b>Car Pool Manager</b></div>
    <h1>Reset password</h1>
    <p class="muted">Set a new password for {{ email }}.</p>
    <form method="post" class="form-stack auth-form-clean">
      <label>New password<input type="password" name="password" required autocomplete="new-password"></label>
      <label>Confirm password<input type="password" name="confirm_password" required autocomplete="new-password"></label>
      <button class="btn primary wide">Reset password</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</section>
{% endblock %}
